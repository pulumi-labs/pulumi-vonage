[project]
  name = "pulumi_labs_vonage"
  description = "Experimental: manage Vonage (formerly Nexmo) applications, numbers, subaccounts, API secrets and Verify v2 templates as infrastructure with Pulumi."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "vonage", "nexmo", "communications", "sms", "voice", "category/network"]
  readme = "pulumi_labs_vonage/README.md"
  requires-python = ">=3.9"
  version = "0.0.1+dev"
  license = "Apache-2.0"
  [project.urls]
    Homepage = "https://developer.vonage.com"
    Repository = "https://github.com/pulumi-labs/pulumi-vonage"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_labs_vonage = ["py.typed", "pulumi-plugin.json"]
